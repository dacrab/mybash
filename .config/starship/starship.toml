format = """
[](#2E3440)\
 $python$username\
[](bg:#3B4252 fg:#2E3440)\
 $directory\
[](fg:#3B4252 bg:#434C5E)\
 $git_branch$git_status\
[](fg:#434C5E bg:#88C0D0)\
 $time\
[ ](fg:#88C0D0)\
"""
command_timeout = 1200
add_newline = false

[username]
show_always = true
style_user = "bg:#2E3440 fg:#D8DEE9" # snow on dark
style_root = "bg:#D08770 fg:#2E3440" # orange on dark
format = '[ $user ]($style)'

[directory]
style = "bg:#3B4252 fg:#D8DEE9"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Order matters: substitute longer paths first to avoid partial matches

[git_branch]
symbol = ""
style = "bg:#434C5E fg:#EBCB8B"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#434C5E fg:#A3BE8C"
format = '[$all_status$ahead_behind ]($style)'

[python]
style = "bg:#2E3440 fg:#8FBCBB"
format = '[(\($virtualenv\) )]($style)'

[time]
time_format = "%R" # hour:minute
style = "bg:#88C0D0 fg:#2E3440"
format = '[ $time ]($style)'
