This is the modified Starship configuration using a simple, dark Everforest color palette.

I've used the following Everforest colors:

#2B333F: Dark Hard Background (for Python/Username)

#39424C: Dark Medium Background (for Directory)

#434C5E: Dark Soft Background (for Git)

#7FDDD3: Dark Blue Accent (for Python environment and Time background)

#D3C6AA: Dark Foreground (default text color)

#D2E79B: Dark Yellow/Green (for Git branch)

#8CCF72: Dark Green (for Git status)

#E67E50: Dark Orange/Red (for Root user background)

