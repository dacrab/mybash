command_timeout = 1200
add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
# User: Dark Hard BG (#2B333F), Dark Foreground (#D3C6AA)
style_user = "bg:#2B333F fg:#D3C6AA"
# Root: Dark Red/Orange BG (#E67E50), Dark Hard BG FG (#2B333F)
style_root = "bg:#E67E50 fg:#2B333F"
format = '[ $user ]($style)'

[directory]
# Directory: Dark Medium BG (#39424C), Dark Foreground (#D3C6AA)
style = "bg:#39424C fg:#D3C6AA"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

 

 

 

 

[git_branch]
symbol = ""
# Git Branch: Dark Soft BG (#434C5E), Dark Yellow/Green (#D2E79B)
style = "bg:#434C5E fg:#D2E79B"
format = '[ $symbol $branch ]($style)'

[git_status]
# Git Status: Dark Soft BG (#434C5E), Dark Green (#8CCF72)
style = "bg:#434C5E fg:#8CCF72"
format = '[$all_status$ahead_behind ]($style)'

 

 

 

 

 

 

[python]
# Python: Dark Hard BG (#2B333F), Dark Blue Accent (#7FDDD3)
style = "bg:#2B333F fg:#7FDDD3"
format = '[(\($virtualenv\) )]($style)'

 

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
# Time: Dark Blue Accent BG (#7FDDD3), Dark Hard BG FG (#2B333F)
style = "bg:#7FDDD3 fg:#2B333F"
format = '[ $time ]($style)'
